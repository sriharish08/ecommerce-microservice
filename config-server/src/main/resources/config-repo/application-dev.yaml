spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000

    cache:
      type: redis

feign:
  compression:
    request:
      enabled: true
  client:
    product-service: http://localhost:8081/api/products
    auth-service: http://localhost:8083/api/auth
    notification-service: http://localhost:8084/api/notifications
    payment-service: http://localhost:8085/api/payments

jwt:
  secret: 4n8RzPq7LmX2vHs9KdF5aBc8NeY6UwTgJrM1xCvZpQwEsA7yBnD3fGhJkL9mNoP2
  expiration: 86400000 # 24 hours in milliseconds

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # 4xx from a downstream call is the caller's fault, not a health signal for that
        # service - it shouldn't count toward opening the circuit.
        ignore-exceptions:
          - feign.FeignException$FeignClientException

  retry:
    configs:
      default:
        max-attempts: 2
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

management:
  endpoint:
    health:
      show-details: always

  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

  health:
    circuitbreakers:
      enabled: true

  tracing:
    enabled: true
    sampling:
      probability: 1.0

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name},%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
  level:
    root: INFO