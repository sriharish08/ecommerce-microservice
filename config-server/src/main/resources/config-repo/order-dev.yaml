server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/order_dev
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    io.github.resilience4j.circuitbreaker: TRACE


app:
  environment: DEV


